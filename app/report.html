<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self';
           script-src 'self';
           connect-src https://script.google.com
                       https://script.googleusercontent.com;
           img-src 'self' https: data:;
           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
           font-src 'self' https://fonts.gstatic.com;">
<title>開催報告 — FORMULA GYMKHANA</title>
<link rel="stylesheet" href="../js/style.css?v=20260724h">
<style>
  /* ──────────────────────────────────────────────────────────
     開催報告は「独立した帳票」ではなく admin.html のサブページとして扱う。
     寸法・色・角丸・影は admin.html の同名クラスと同じ値を使うこと
     （admin.html は --navy/--gray/--border 等のローカル別名を定義しているが、
     実体は style.css の --fg-* なので、ここでは実体名を直接使っている）。
     ⚠ 共通CSS(js/style.css)には手を入れない。変更はこのファイル内で完結させる。
     ⚠ 画面はカードを入れ子にしない。KPI(.stat-card)は .section の外に直接置く。
     ────────────────────────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
         background: var(--fg-bg); min-height: 100vh; color: var(--fg-text); font-size: 14px; }
  button, input, select { font: inherit; }

  /* ── ログイン（admin.html の LOGIN と同じ寸法） ── */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .login-card { background: #fff; border-radius: var(--radius-card); width: 100%; max-width: 360px;
                box-shadow: var(--shadow-card); overflow: hidden; }
  .login-hd { background: #fff; padding: 18px 22px; border-bottom: 3px solid var(--fg-blue); }
  .login-logo { height: 26px; width: auto; display: block; }
  .login-sub { font-size: 11px; color: var(--fg-muted); margin-top: 3px; }
  .login-body { padding: 24px 22px 28px; }
  .login-label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 5px; }
  .login-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--fg-line); border-radius: 8px;
                 font-size: 15px; margin-bottom: 14px; transition: border-color .15s; }
  .login-input:focus { outline: none; border-color: var(--fg-blue); }
  .login-err { font-size: 12px; color: var(--fg-error); margin-bottom: 12px; display: none; }
  .login-btn { width: 100%; padding: 14px; background: var(--fg-blue); color: #fff; border: none;
               border-radius: var(--radius-ui); font-size: 15px; font-weight: 600; cursor: pointer; }
  .login-btn:disabled { background: var(--fg-disabled); cursor: not-allowed; }

  /* ── サブページヘッダ（admin.html の .page-hd と同じ） ── */
  .page-hd { background: #fff; border-bottom: 3px solid var(--fg-blue); padding: 0 14px;
             display: flex; align-items: center; height: 48px; position: sticky; top: 0; z-index: 100; gap: 10px; }
  .page-back { color: var(--fg-blue); font-size: 12px; text-decoration: none; white-space: nowrap;
               flex-shrink: 0; padding: 6px 0; }
  .page-title { flex: 1; font-size: 13px; font-weight: 700; color: var(--fg-navy); text-align: center;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-hd-spacer { flex-shrink: 0; width: 64px; }

  /* ── ページ共通ボディ（admin.html の .app-body と同じ） ── */
  .app-body { max-width: 960px; margin: 0 auto; padding: 16px 24px 60px; }

  /* ── アクション行（admin.html の .action-row / .act-btn と同じ） ── */
  .action-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .act-btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
             border: none; display: flex; align-items: center; gap: 5px; }
  .act-btn-ghost { background: #fff; border: 1.5px solid var(--fg-line); color: var(--fg-navy);
                   box-shadow: var(--shadow-sm); }
  .ev-select { flex: 1; min-width: 240px; padding: 9px 11px; border: 1.5px solid var(--fg-line);
               border-radius: 7px; font-size: 13px; color: var(--fg-text); background: #fff; }
  .ev-select:focus { outline: none; border-color: var(--fg-navy); }

  /* ── イベント名（大見出しにしない。admin の .ev-card-name と同じ 15px） ── */
  .ev-head { margin-bottom: 4px; }
  .ev-head-name { font-size: 15px; font-weight: 700; color: var(--fg-navy); margin-bottom: 4px; }
  .ev-head-meta { font-size: 12px; color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }

  /* ── エリアラベル（admin.html の .area-label と同じ） ── */
  .area-label { font-size: 11px; font-weight: 700; color: var(--fg-muted); letter-spacing: .1em;
                margin: 20px 0 8px 2px; display: flex; align-items: center; gap: 8px; }
  .area-label::after { content: ''; flex: 1; height: 1px; background: var(--fg-line); }

  /* ── KPI（admin.html の .stat-grid / .stat-card と同じ表情。列数だけ3列） ── */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card { background: #fff; border-radius: 10px; padding: 14px; text-align: center;
               box-shadow: var(--shadow-sm); }
  .stat-val { font-size: 30px; font-weight: 700; color: var(--fg-navy); line-height: 1; margin-bottom: 3px;
              font-variant-numeric: tabular-nums; }
  .stat-unit { font-size: 11px; font-weight: 600; color: var(--fg-muted); margin-left: 2px; }
  .stat-lbl { font-size: 11px; color: var(--fg-muted); font-weight: 600; }
  .stat-sub { font-size: 10px; color: var(--fg-muted); margin-top: 4px; line-height: 1.4; }

  /* ── セクション（admin.html の .section と同じ） ── */
  .section { background: #fff; border-radius: var(--radius-ui); margin-bottom: 10px;
             box-shadow: var(--shadow-sm); overflow: hidden; }
  .section-hd { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
                cursor: pointer; user-select: none; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--fg-navy); display: flex;
                   align-items: center; gap: 6px; }
  .section-toggle { font-size: 14px; color: var(--fg-muted); transition: transform .2s; flex-shrink: 0; }
  .section-toggle.open { transform: rotate(180deg); }
  .section-body { padding: 0 16px 14px; display: none; }
  .section-body.open { display: block; }
  .section.no-fold .section-hd { cursor: default; }
  .section.no-fold .section-toggle { display: none; }
  .section.no-fold .section-body { display: block; }

  /* セクション内の補足文（admin.html の .cfg-hint 相当） */
  .sec-note { font-size: 11px; color: var(--fg-muted); line-height: 1.7; margin-bottom: 10px; }
  .sec-note + .sec-note { margin-top: -4px; }
  /* セクション内の小見出し（admin.html の .cfg-group-title と同じ） */
  .sub-title { font-size: 11px; font-weight: 700; color: var(--fg-muted); letter-spacing: .08em;
               margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--fg-line); }
  .sub-block + .sub-block { margin-top: 18px; }

  /* ── 表（admin.html の .data-tbl と同じ。縞模様・外枠は付けない） ── */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .data-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-tbl th { background: var(--fg-navy); color: #fff; padding: 7px 10px; text-align: left; font-weight: 600; }
  .data-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--fg-line); color: var(--fg-text); }
  .data-tbl tbody th { background: #fff; color: var(--fg-text); font-weight: 600;
                       border-bottom: 1px solid var(--fg-line); }
  .data-tbl tbody tr:last-child td, .data-tbl tbody tr:last-child th { border-bottom: none; }
  .data-tbl th.num, .data-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .data-tbl .th-sub { display: block; font-size: 9px; font-weight: 600; color: rgba(255,255,255,.72); margin-top: 2px; }
  .data-tbl .cell-sub { display: block; font-size: 9px; color: var(--fg-muted); margin-top: 2px; white-space: nowrap; }
  .data-tbl .total-row td, .data-tbl .total-row th { background: var(--fg-blue-soft); color: var(--fg-navy);
                                                     font-weight: 700; }
  .empty-msg { text-align: center; color: var(--fg-muted); padding: 20px; font-size: 13px; }

  /* ブース表は列が多いので、ブース名と合計だけ固定して横スクロールさせる（維持する機能） */
  .booth-tbl { min-width: 720px; }
  .booth-tbl thead th { text-align: center; }
  .booth-tbl thead .col-booth { text-align: left; }
  .booth-tbl .col-booth { position: sticky; left: 0; z-index: 2; background: #fff;
                          min-width: 150px; max-width: 220px; overflow-wrap: anywhere; }
  .booth-tbl thead .col-booth { z-index: 4; background: var(--fg-navy); }
  .booth-tbl .col-total { position: sticky; right: 0; z-index: 2; background: #fff;
                          border-left: 1px solid var(--fg-line); }
  .booth-tbl thead .col-total { z-index: 4; background: var(--fg-navy); }
  .booth-tbl .total-row .col-booth, .booth-tbl .total-row .col-total { background: var(--fg-blue-soft); }

  .attr-tbl { min-width: 340px; }
  .attr-detail { display: block; font-size: 9px; font-weight: 400; color: var(--fg-muted);
                 line-height: 1.55; margin-top: 4px; }
  .attr-detail span { display: block; }
  .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .attr-grid .sub-block { margin-top: 0; }
  .attr-wide { grid-column: 1 / -1; }

  .state-msg { padding: 48px 20px; color: var(--fg-muted); font-size: 13px; line-height: 1.7; text-align: center; }
  .state-msg .spinner { margin-bottom: 14px; }
  .retry-btn { margin-top: 12px; padding: 8px 14px; border: 1px solid var(--fg-line); border-radius: var(--radius-ui);
               background: #fff; color: var(--fg-navy); font-size: 12px; font-weight: 700; cursor: pointer; }
  .page-back:focus-visible, .act-btn:focus-visible, .login-btn:focus-visible,
  .retry-btn:focus-visible, .section-hd:focus-visible {
    outline: 3px solid rgba(53,32,208,.2); outline-offset: 2px;
  }

  @media (max-width: 640px) {
    .app-body { padding: 12px 12px 44px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .attr-grid { grid-template-columns: 1fr; }
    .attr-wide { grid-column: auto; }
    .ev-select { min-width: 0; flex-basis: 100%; }
  }

  /* ──────────────────────────────────────────────────────────
     印刷は画面と役割が違う。画面＝管理画面の一機能、印刷＝配布用の帳票。
     レイアウト（並び順・表・KPI）はそのまま活かし、画面用の装飾
     （影・面の背景・折りたたみ・操作系）だけを外す。
     ────────────────────────────────────────────────────────── */
  @page { size: A4; margin: 12mm; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    .app-body { max-width: none; padding: 0; }
    .area-label { margin: 14px 0 6px; }
    /* 影と面の背景を落として帳票の紙面に寄せる */
    .section { box-shadow: none; border: 1px solid var(--fg-line); border-radius: 0; margin-bottom: 10px; }
    .section-hd { padding: 8px 10px; border-bottom: 1px solid var(--fg-line); }
    .section-toggle { display: none !important; }
    .section-body { display: block !important; padding: 10px; }
    .stat-card { box-shadow: none; border: 1px solid var(--fg-line); border-radius: 0; padding: 8px 4px; }
    /* 画面と同じ3列を保つ。5列にすると6枚目だけが次行に落ちて紙面が崩れる */
    .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
    .stat-val { font-size: 20px; }
    .tbl-wrap { overflow: visible; }
    .data-tbl { font-size: 9px; }
    .data-tbl th, .data-tbl td, .data-tbl tbody th { padding: 5px 6px; }
    .booth-tbl, .attr-tbl { min-width: 0; }
    .booth-tbl .col-booth, .booth-tbl .col-total { position: static; }
    .attr-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .sec-note, .stat-sub, .attr-detail { color: #444; }
    .stat-grid, .section, .sub-block, .data-tbl tr { break-inside: avoid; }
    .data-tbl thead { display: table-header-group; }
  }
</style>
</head>
<body>

<div id="state-login" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-hd">
        <img class="login-logo" src="../assets/logo.png" alt="FORMULA GYMKHANA">
        <p class="login-sub">開催報告</p>
      </div>
      <form class="login-body" id="login-form">
        <label class="login-label" for="f-key">管理者キー</label>
        <input class="login-input" type="password" id="f-key" placeholder="管理者キー" autocomplete="current-password">
        <p class="login-err" id="login-err">キーが正しくありません</p>
        <button class="login-btn" id="btn-login" type="submit">ログイン</button>
      </form>
    </div>
  </div>
</div>

<div id="state-app" style="display:none">
  <header class="page-hd no-print">
    <a class="page-back" href="admin.html">← 管理画面</a>
    <div class="page-title">開催報告</div>
    <span class="page-hd-spacer"></span>
  </header>

  <main class="app-body">
    <div class="action-row no-print">
      <select id="ev-select" class="ev-select" aria-label="対象イベント"></select>
      <button class="act-btn act-btn-ghost" id="btn-print" type="button">🖨 印刷</button>
    </div>

    <div id="report-body">
      <p class="state-msg">イベントを選択してください</p>
    </div>
  </main>
</div>

<script src="../js/config.js?v=20260724h"></script>
<script src="../js/report.js?v=20260826a"></script>
</body>
</html>
