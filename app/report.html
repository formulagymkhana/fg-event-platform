<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self';
           script-src 'self';
           connect-src https://script.google.com
                       https://script.googleusercontent.com;
           img-src 'self' https: data:;
           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
           font-src 'self' https://fonts.gstatic.com;">
<title>開催報告 — FORMULA GYMKHANA</title>
<link rel="stylesheet" href="../js/style.css?v=20260724h">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
         background: var(--fg-bg); color: var(--fg-text); font-size: 14px; padding: 20px 16px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* ログイン（admin.html と同じ鍵。localStorage を共有するので admin.html でログイン済みなら不要） */
  .login-card { background: #fff; border-radius: var(--radius-card); max-width: 360px; margin: 80px auto;
                box-shadow: var(--shadow-card); overflow: hidden; }
  .login-hd { padding: 18px 22px; border-bottom: 3px solid var(--fg-blue); font-weight: 700; }
  .login-body { padding: 20px 22px; }
  .login-body input { width: 100%; padding: 11px 13px; border: 1.5px solid var(--fg-line); border-radius: 8px;
                       font-size: 15px; margin-bottom: 10px; }
  .login-body button { width: 100%; padding: 12px; background: var(--fg-blue); color: #fff; border: none;
                        border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .login-err { color: var(--fg-error); font-size: 12px; margin-top: 8px; display: none; }

  .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
  .hd h1 { font-size: 16px; color: var(--fg-navy); }
  .ev-select { padding: 8px 10px; border: 1.5px solid var(--fg-line); border-radius: 8px; font-size: 13px; }

  .card { background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card);
          padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; color: var(--fg-navy); margin-bottom: 4px; }
  .card .note { font-size: 11px; color: var(--fg-muted); margin-bottom: 14px; line-height: 1.6; }

  table.report-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.report-tbl th { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--fg-line);
                         font-size: 11px; color: var(--fg-muted); font-weight: 700; }
  table.report-tbl td { padding: 9px 6px; border-bottom: 1px solid var(--fg-line); }
  table.report-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.report-tbl tr.total-row td { font-weight: 700; border-top: 2px solid var(--fg-navy);
                                      border-bottom: none; background: var(--fg-blue-soft); }
  .src-note { font-size: 11px; color: var(--fg-muted); margin-top: 10px; line-height: 1.7; }

  .prize-stats { display: flex; gap: 12px; }
  .prize-stat { flex: 1; text-align: center; }
  .prize-stat .val { font-size: 26px; font-weight: 700; color: var(--fg-navy); line-height: 1; margin-bottom: 4px; }
  .prize-stat .lbl { font-size: 11px; color: var(--fg-muted); font-weight: 600; }

  .state-msg { text-align: center; color: var(--fg-muted); padding: 40px 0; font-size: 13px; }
  .print-btn { padding: 8px 14px; background: var(--fg-navy); color: #fff; border: none; border-radius: 8px;
               font-size: 12px; font-weight: 700; cursor: pointer; }
  @media print {
    .no-print { display: none !important; }
    body { padding: 0; background: #fff; }
    .card { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>

<div id="state-login" class="wrap" style="display:none">
  <div class="login-card">
    <div class="login-hd">FG 開催報告 — ログイン</div>
    <div class="login-body">
      <input type="password" id="f-key" placeholder="管理者キー" autocomplete="off">
      <button id="btn-login">ログイン</button>
      <p class="login-err" id="login-err">キーが正しくありません</p>
    </div>
  </div>
</div>

<div id="state-app" class="wrap" style="display:none">
  <div class="hd no-print">
    <h1>📊 開催報告</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="ev-select" class="ev-select"></select>
      <button class="print-btn" id="btn-print">🖨 印刷</button>
    </div>
  </div>

  <div id="report-body">
    <p class="state-msg">イベントを選択してください</p>
  </div>
</div>

<script src="../js/config.js?v=20260724h"></script>
<script src="../js/report.js?v=20260825c"></script>
</body>
</html>
